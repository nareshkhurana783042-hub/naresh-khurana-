<svg width="540" height="120" viewBox="0 0 540 120" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="clapperGradPurple" x1="10" y1="10" x2="110" y2="110" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#A78BFA"/>
      <stop offset="50%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#6D28D9"/>
    </linearGradient>
    <filter id="badgeShadowPurple" x="0" y="4" width="120" height="120" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#8B5CF6" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- 1. Emblem Badge (Film Clapper + Cutting Scissors) -->
  <g filter="url(#badgeShadowPurple)">
    <rect x="12" y="12" width="96" height="96" rx="26" fill="url(#clapperGradPurple)"/>
    <rect x="12" y="12" width="96" height="96" rx="26" stroke="#DDD6FE" stroke-width="1.5" stroke-opacity="0.5"/>
  </g>

  <!-- Clapperboard Top Strip with Diagonal Cine-Bars -->
  <path d="M26 31C26 27.6863 28.6863 25 32 25H88C91.3137 25 94 27.6863 94 31V41H26V31Z" fill="#0B0813"/>
  <path d="M38 25L30 41H38L46 25H38Z" fill="#F5F3FF"/>
  <path d="M56 25L48 41H56L64 25H56Z" fill="#F5F3FF"/>
  <path d="M74 25L66 41H74L82 25H74Z" fill="#F5F3FF"/>

  <!-- Vertical 9:16 Video Frame Silhouette -->
  <rect x="44" y="46" width="32" height="48" rx="6" fill="#0B0813" fill-opacity="0.25"/>

  <!-- Precision Cutting Scissors Overlay (Clipper) -->
  <circle cx="39" cy="80" r="8" fill="none" stroke="#0B0813" stroke-width="4.5"/>
  <path d="M44 75L76 53" stroke="#0B0813" stroke-width="5" stroke-linecap="round"/>
  
  <circle cx="81" cy="80" r="8" fill="none" stroke="#0B0813" stroke-width="4.5"/>
  <path d="M76 75L44 53" stroke="#0B0813" stroke-width="5" stroke-linecap="round"/>

  <!-- Scissors Center Pivot Rivet -->
  <circle cx="60" cy="64" r="4" fill="#F5F3FF" stroke="#0B0813" stroke-width="2.5"/>

  <!-- 2. Typography -->
  <text x="130" y="65" fill="#FFFFFF" font-family="'Geist', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="44" letter-spacing="1">CLIPPER</text>
  
  <!-- Subtitle Badge Pill -->
  <rect x="130" y="77" width="232" height="26" rx="7" fill="#8B5CF6" fill-opacity="0.2"/>
  <rect x="130" y="77" width="232" height="26" rx="7" stroke="#8B5CF6" stroke-opacity="0.5" stroke-width="1"/>
  <text x="140" y="95" fill="#A78BFA" font-family="'Geist', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="12" letter-spacing="2.6">BY NARESH KHURANA</text>
</svg>
