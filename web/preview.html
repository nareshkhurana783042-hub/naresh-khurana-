<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="utf-8">
  <title>Clipper - Theme Color Preview</title>
  <style>
    body {
      margin: 0;
      background: #0D0907;
      color: #fff;
      font-family: system-ui, -apple-system, sans-serif;
      text-align: center;
      padding: 30px 15px;
    }
    h1 {
      font-size: 28px;
      margin-bottom: 8px;
      color: #8B5CF6;
    }
    p {
      color: #A99A91;
      font-size: 16px;
      max-width: 600px;
      margin: 0 auto 24px;
    }
    .img-box {
      max-width: 1000px;
      margin: 0 auto 30px;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 10px 40px rgba(0,0,0,0.8);
      border: 1px solid rgba(255,255,255,0.1);
    }
    img {
      width: 100%;
      height: auto;
      display: block;
    }
    .options {
      display: flex;
      justify-content: center;
      gap: 16px;
      flex-wrap: wrap;
      margin-top: 20px;
    }
    .btn {
      padding: 12px 24px;
      border-radius: 10px;
      border: 0;
      font-weight: 700;
      font-size: 15px;
      cursor: pointer;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 8px;
      text-decoration: none;
    }
    .btn-purple { background: #8B5CF6; }
    .btn-blue { background: #0284C7; }
    .btn-green { background: #10B981; }
    .btn-red { background: #EF4444; }
  </style>
</head>
<body>
  <h1>🎨 Clipper by Naresh Khurana - New Theme Previews</h1>
  <p>नीचे दी गई इमेज में 3 नए प्रीमियम थीम कलर्स का पूरा लुक देखें:</p>

  <div class="img-box">
    <img src="/brand/theme-mockup.jpg" alt="Clipper Theme Mockup">
  </div>

  <h2>इनमें से कौन सा थीम कलर आपको पूरे प्रोजेक्ट पर लगाना है?</h2>
  <div class="options">
    <div class="btn btn-purple">🟣 1. Cyberpunk Purple (#8B5CF6)</div>
    <div class="btn btn-blue">🔵 2. Electric Blue (#0284C7)</div>
    <div class="btn btn-green">🟢 3. Emerald Green (#10B981)</div>
    <div class="btn btn-red">🔴 4. Crimson Red (#EF4444)</div>
  </div>
</body>
</html>
